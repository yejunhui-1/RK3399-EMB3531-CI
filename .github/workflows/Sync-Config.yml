# SPDX-License-Identifier: MIT
#
# 配置同步工作流：每日拉取 iStoreOS 官方最新 armv8 编译配置
# 并追加本仓库 Config/RK3399-EMB3531.txt 增量配置
# 参考 iStoreOS-RK35XX-24.10 的 sync-files.yml
name: Sync Config

on:
  repository_dispatch:
  workflow_dispatch:
  #自动同步：北京时间每天 23:55
  schedule:
    - cron: 55 15 * * *

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 准备完成
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载官方编译配置
        run: |
          mkdir -p ./armv8
          wget --no-check-certificate --no-cache -O ./armv8/feeds.conf https://fw0.koolcenter.com/iStoreOS/easepi-r1/feeds.conf
          wget --no-check-certificate --no-cache -O ./armv8/.config https://fw0.koolcenter.com/iStoreOS/easepi-r1/config.buildinfo

          FILE_PATH="./armv8/.config"
          if [ -f "$FILE_PATH" ] && [ -s "$FILE_PATH" ]; then
             content=$(cat ${GITHUB_WORKSPACE}/Config/RK3399-EMB3531.txt)
             configdata=$(echo "$content" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
             echo -e "\\n$configdata" >> ./armv8/.config
             # 清除.config配置文件里面重复的配置项
             configdata2=$(cat ./armv8/.config)
             echo "$configdata2" | awk '!seen[$0]++ && NF > 0' > ./armv8/.config
          else
             echo "不处理数据。"
          fi

      - name: Git 提交更新的配置文件
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'github-actions[bot]@github.com'
          git add ./armv8/.config ./armv8/feeds.conf
          # 检测有无改动，无改动直接跳过提交
          if git diff --staged --quiet; then
            echo "配置文件无更新，跳过推送"
          else
            git commit -m "Sync config: 更新iStoreOS官方配置"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 删除运行记录
        uses: xiaomeng9597/delete-workflow-runs@main
        with:
          retain_days: 20
          keep_minimum_runs: 15
          token: ${{ secrets.GITHUB_TOKEN }}
